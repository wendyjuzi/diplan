{
  "base_eval_config": "configs/eval_torch_kgqa.yaml",
  "dataset": "webqsp",
  "anchor_experiment": "full_diplan_torch",
  "experiments": [
    {
      "name": "full_diplan_torch",
      "label": "Full DiPLaN",
      "overrides": {
        "include_datasets": ["webqsp"],
        "num_candidates": 12,
        "receding_horizon": true,
        "use_value_model": true
      }
    },
    {
      "name": "no_value_guidance_torch",
      "label": "No Value",
      "overrides": {
        "include_datasets": ["webqsp"],
        "use_value_model": false
      }
    },
    {
      "name": "no_receding_horizon_torch",
      "label": "No RHC",
      "overrides": {
        "include_datasets": ["webqsp"],
        "receding_horizon": false
      }
    },
    {
      "name": "low_candidate_budget_torch",
      "label": "Low Budget",
      "overrides": {
        "include_datasets": ["webqsp"],
        "num_candidates": 4
      }
    }
  ]
}
